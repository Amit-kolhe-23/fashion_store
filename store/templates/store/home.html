<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Store</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        /* Hero Section */
        .hero-section {
            background-image: url('https://via.placeholder.com/1600x600'); /* Add hero image */
            background-size: cover;
            background-position: center;
            color: white;
            padding: 100px 0;
            text-align: center;
        }

        .hero-section h1 {
            font-size: 4rem;
            font-weight: bold;
        }

        /* Product Card */
        .product-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .product-card:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .product-card img {
            height: 200px;
            object-fit: cover;
        }

        .category-card img {
            height: 100%;
            object-fit: cover;
        }

        .category-card {
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .category-card:hover {
            transform: scale(1.05);
        }

        /* Footer */
        .footer {
            background-color: #333;
            color: white;
            padding: 50px 0;
        }

        .footer .social-icons a {
            color: white;
            margin: 0 15px;
            font-size: 1.5rem;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Fashion Store</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#products">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="#cart">Cart</a></li>
                    <li class="nav-item"><a class="nav-link" href="#order-history">Order History</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="container">
            <h1>Welcome to Fashion Store</h1>
            <p class="lead">Discover the latest trends in fashion and accessories</p>
            <a href="#products" class="btn btn-light btn-lg">Shop Now</a>
        </div>
    </section>

    <!-- Category Filter Section -->
    <section id="categories" class="container py-5 text-center">
        <h2>Shop By Category</h2>
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="category-card">
                    <img src="https://via.placeholder.com/500x300" class="img-fluid" alt="Men's Fashion">
                    <div class="category-overlay">
                        <a href="#men" class="btn btn-primary">Shop Men's Fashion</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="category-card">
                    <img src="https://via.placeholder.com/500x300" class="img-fluid" alt="Women's Fashion">
                    <div class="category-overlay">
                        <a href="#women" class="btn btn-primary">Shop Women's Fashion</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="category-card">
                    <img src="https://via.placeholder.com/500x300" class="img-fluid" alt="Kids Fashion">
                    <div class="category-overlay">
                        <a href="#kids" class="btn btn-primary">Shop Kids' Fashion</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Products Section -->
    <section id="products" class="container py-5">
        <h2 class="text-center mb-4">Trending Products</h2>
        <div class="row" id="product-list">
            <!-- Dynamic product cards will be injected here -->
        </div>
    </section>

    <!-- Footer Section -->
    <footer class="footer text-center py-4">
        <p>&copy; 2025 Fashion Store. All rights reserved.</p>
        <div class="social-icons">
            <a href="#" class="fab fa-facebook-f text-white mx-3"></a>
            <a href="#" class="fab fa-twitter text-white mx-3"></a>
            <a href="#" class="fab fa-instagram text-white mx-3"></a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
