<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-5">
        <h2>Order History</h2>
        <table class="table">
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>#12345</td>
                    <td>Stylish Jacket</td>
                    <td>$99.99</td>
                    <td>Shipped</td>
                </tr>
                <tr>
                    <td>#12346</td>
                    <td>Casual T-Shirt</td>
                    <td>$29.99</td>
                    <td>Delivered</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
